name: skapp-mirror
# C 仓镜像: 从 A 仓(qwerzxcva/stocks-ai-view)拉取 skapp 供数文件到此仓。
# app 同时引 A/C 两个 raw 源, 保持内容与 ts 一致(避免多仓 freshest 取到旧 ts)。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: skapp-mirror
  cancel-in-progress: true
jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Sync remote main
        run: |
          git fetch origin main
          git merge --ff-only origin/main || echo "already up to date"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Mirror from A repo
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request
          OWNER, REPO, BR = "qwerzxcva", "stocks-ai-view", "main"
          API = f"https://api.github.com/repos/{OWNER}/{REPO}/contents"
          RAW = f"https://raw.githubusercontent.com/{OWNER}/{REPO}/{BR}"
          H = {"User-Agent": "skapp-mirror"}
          def fetch(u):
              req = urllib.request.Request(u, headers=H)
              with urllib.request.urlopen(req, timeout=60) as r: return r.read()
          def fetch_json(u):
              return json.loads(fetch(u))
          def ls(path):
              try: return fetch_json(f"{API}/{path}?ref={BR}")
              except Exception: return []
          # 1) app 的四个文件
          for p in ["data/data/decision.json", "data/data/today_picks.json", "data/data/stock_names.json"]:
              try:
                  b = fetch(f"{RAW}/{p}")
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  open(p, "wb").write(b); print("ok", p, len(b))
              except Exception as e: print("skip", p, e)
          # 2) API 顶层文件
          for p in ["data/api/index.json", "data/api/market.json"]:
              try:
                  b = fetch(f"{RAW}/{p}")
                  os.makedirs(os.path.dirname(p), exist_ok=True)
                  open(p, "wb").write(b); print("ok", p, len(b))
              except Exception as e: print("skip", p, e)
          # 3) API 逐股文件与 QA(跟随 A 仓目录, 上限各 200)
          for sub, cap in (("stocks", 200), ("qa", 200)):
              items = [f for f in ls(f"data/api/{sub}") if isinstance(f, dict) and f.get("name", "").endswith(".json")][:cap]
              for f in items:
                  p = f"data/api/{sub}/{f['name']}"
                  try:
                      b = fetch(f['download_url'])
                      os.makedirs(os.path.dirname(p), exist_ok=True)
                      open(p, "wb").write(b)
                  except Exception as e: print("skip", p, e)
              print(f"{sub}: {len(items)} files")
          PYEOF
      - name: Commit & push
        run: |
          git config user.name "skapp-mirror-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -- data/data data/api
          git commit -m "skapp mirror $(date -u +%FT%TZ)" || echo "no change"
          git push
