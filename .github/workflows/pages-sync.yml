name: pages-data-sync
# 全量对比 A 仓 (qwerzxcva/stocks-ai-view, 118 文件) → 本仓 data/ (Pages 同源)。
# 动态 diff: 新增+内容更新都同步, 保证前端同源数据 = A 仓全量。
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: pages-sync
  cancel-in-progress: true
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Full diff-sync from A repo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PYEOF'
          import json, os, urllib.request, base64, time
          TOK = os.environ["GH_TOKEN"]
          A = ("qwerzxcva", "stocks-ai-view")
          C = ("dufuwuxin", "stocks-ai-view-c")
          def gh_list(repo, path="data"):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo[0]}/{repo[1]}/contents/{path}?ref=main",
                  headers={"Authorization": "token "+TOK})
              return json.load(urllib.request.urlopen(req, timeout=30))
          def gh_get(repo, path):
              req = urllib.request.Request(f"https://api.github.com/repos/{repo[0]}/{repo[1]}/contents/{path}?ref=main",
                  headers={"Authorization": "token "+TOK})
              d = json.load(urllib.request.urlopen(req, timeout=30))
              return base64.b64decode(d["content"]), d["sha"]
          def gh_put(repo, path, content, sha=None):
              body = {"message": "pages-sync: "+path.split("/")[-1], "content": base64.b64encode(content).decode()}
              if sha: body["sha"] = sha
              req = urllib.request.Request(f"https://api.github.com/repos/{repo[0]}/{repo[1]}/contents/{path}",
                  data=json.dumps(body).encode(), headers={"Authorization": "token "+TOK, "Content-Type": "application/json"}, method="PUT")
              urllib.request.urlopen(req, timeout=30)
          a = {x["name"]: x for x in gh_list(A) if x["type"]=="file"}
          c = {x["name"]: x for x in gh_list(C) if x["type"]=="file"}
          n_new = n_upd = 0
          for name, info in a.items():
              if info["size"] > 3_000_000: continue
              try:
                  content, sha_a = gh_get(A, "data/"+name)
              except Exception:
                  continue
              if name in c:
                  # 内容相同则跳过
                  try:
                      content_c, sha_c = gh_get(C, "data/"+name)
                      if content_c == content: continue
                  except Exception:
                      sha_c = None
                  try:
                      gh_put(C, "data/"+name, content, sha_c); n_upd += 1
                  except Exception: pass
              else:
                  try:
                      gh_put(C, "data/"+name, content); n_new += 1
                  except Exception: pass
              time.sleep(0.2)
          print(f"pages-sync: new={n_new} updated={n_upd}")
          PYEOF
